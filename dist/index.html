<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Revenge Plugins</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    code, pre { background: #f4f4f5; padding: .2em .4em; border-radius: 4px; }
    pre { padding: 1rem; overflow: auto; }
    a.btn { display: inline-block; background: #5865F2; color: #fff; padding: .6rem 1rem; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Revenge Plugins</h1>
  <h2>QuickFrom</h2>
  <p>长按消息 → 搜索此人发言；支持关键词筛选。</p>
  <pre id="quickfrom"></pre>
  <h2>AntiRecall</h2>
  <p>独立的本地撤回与编辑记录插件。长按消息可查看该消息历史或本频道记录。</p>
  <pre id="antirecall"></pre>
  <p><a class="btn" id="copy" href="#">复制 AntiRecall 安装链接</a></p>
  <ol><li>Revenge → Plugins → 安装插件</li><li>粘贴对应链接并启用</li></ol>
  <p><a href="https://github.com/benchu985/revenge-quick-from">源码 GitHub</a></p>
  <script>
    const root = location.href.replace(/index\.html.*/, '');
    const quickfrom = new URL('QuickFrom/', root).href;
    const antirecall = new URL('AntiRecall/', root).href;
    document.getElementById('quickfrom').textContent = quickfrom;
    document.getElementById('antirecall').textContent = antirecall;
    document.getElementById('copy').onclick = async (e) => {
      e.preventDefault();
      await navigator.clipboard.writeText(antirecall);
      alert('已复制: ' + antirecall);
    };
  </script>
</body>
</html>
